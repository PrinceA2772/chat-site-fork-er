<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>
</head>
<body>
    <script>
        // Use replaceState to update the URL without adding a new history entry
        // or reloading the current page.
        history.replaceState(null, '', '/Chatting_updated/public/index.html');
        
        // Note: replaceState does not load the new page. 
        // To actually navigate to the new URL, you must also change location.href.
        // If you want to change the URL ONLY (not load the page), remove the line below.
        window.location.href = '/Chatting_updated/public/index.html';
    </script>
</body>
</html>
