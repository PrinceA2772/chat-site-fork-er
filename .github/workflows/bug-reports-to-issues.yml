# Mirror in-site bug reports into GitHub issues.
#
# The site writes reports to the Supabase `bug_reports` table (see
# supabase/037_bug_reports.sql). This workflow polls that table and opens one
# issue per report, so every report lands in this repo's issue tracker where
# the operator can triage it.
#
# WHY A WORKFLOW INSTEAD OF THE BROWSER POSTING TO GITHUB DIRECTLY:
# opening an issue through the GitHub API needs a token with `issues: write`.
# A token in client-side JavaScript is readable by anyone who opens devtools,
# so it would let a stranger act as the repo owner. The runner's GITHUB_TOKEN
# is injected by GitHub at run time, is scoped to this repository, and expires
# when the job ends — nothing secret is ever shipped to a browser.
#
# REQUIRED REPOSITORY SECRETS
#   SUPABASE_SECRET_KEY — the Supabase secret key (sb_secret_...) for this
#     project. Add it at: Settings → Secrets and variables → Actions → New
#     repository secret. It is used ONLY here, server-side, to read the
#     reports table. Never put it in Chatting_updated/public/**.
#
#   Legacy projects may instead set SUPABASE_SERVICE_KEY (the service_role
#   JWT); the workflow still accepts it.
#
#   The publishable key (sb_publishable_...) is NOT used here. It is for the
#   browser only; server-side requests authenticate with the secret key alone.
#   Do not put a secret key in Authorization alongside a publishable apikey —
#   PostgREST rejects that combination with 401 PGRST301 because the new
#   secret keys are not JWTs ("Expected 3 parts in JWT; got 1").
#
# Until a key exists the workflow exits cleanly without failing, so it is safe
# to merge before the secrets are configured.

name: Mirror bug reports to issues

on:
  schedule:
    # every 15 minutes; GitHub may delay scheduled runs under load
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: bug-report-mirror
  cancel-in-progress: false

jobs:
  mirror:
    name: Open issues for new reports
    runs-on: ubuntu-latest
    steps:
      - name: Check the secret is configured
        id: guard
        env:
          SECRET: ${{ secrets.SUPABASE_SECRET_KEY }}
          LEGACY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          # Accept either naming. New-format projects use a secret key
          # (sb_secret_...) plus a publishable key; older ones use the legacy
          # service_role JWT for both headers.
          if [ -n "$SECRET" ]; then
            echo "::notice::Using SUPABASE_SECRET_KEY (new-format secret key)."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$LEGACY" ]; then
            echo "::notice::Using SUPABASE_SERVICE_KEY (legacy service_role JWT)."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No Supabase key configured — skipping. Add SUPABASE_SECRET_KEY in Settings → Secrets and variables → Actions."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch new reports
        if: steps.guard.outputs.skip == 'false'
        env:
          SUPABASE_URL: https://vjrnabnawhegjdsvbyrc.supabase.co
          SECRET: ${{ secrets.SUPABASE_SECRET_KEY }}
          LEGACY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          # Server-side requests authenticate with the SECRET key in BOTH
          # headers. Supabase's new sb_secret_... keys are opaque strings, not
          # JWTs: putting one in Authorization while a publishable key sits in
          # apikey makes PostgREST answer 401 "Expected 3 parts in JWT; got 1".
          # The publishable key is for browsers only and is not needed here.
          # A legacy service_role JWT is likewise valid in both headers.
          if [ -n "$SECRET" ]; then
            APIKEY="$SECRET"
            AUTH="$SECRET"
            echo "auth mode: SUPABASE_SECRET_KEY"
          else
            APIKEY="$LEGACY"
            AUTH="$LEGACY"
            echo "auth mode: SUPABASE_SERVICE_KEY (legacy)"
          fi
          # Do NOT echo the key itself.
          # status=new and not yet mirrored (issue_number is null)
          http=$(curl -sS \
            -H "apikey: $APIKEY" \
            -H "Authorization: Bearer $AUTH" \
            -H "Accept: application/json" \
            -o reports.json -w '%{http_code}' \
            "$SUPABASE_URL/rest/v1/bug_reports?select=id,kind,title,details,steps,severity,page_url,user_agent,viewport,theme,build,reporter_name,contact,created_at&status=eq.new&issue_number=is.null&order=created_at.asc&limit=20")
          if [ "$http" != "200" ]; then
            echo "::error::Supabase returned HTTP $http while fetching bug reports."
            # PostgREST error bodies never echo the API key; show them so the
            # failure is diagnosable instead of a bare curl exit code.
            head -c 2000 reports.json || true
            echo
            exit 1
          fi
          echo "reports found: $(jq 'length' reports.json)"
          jq -c '.[]' reports.json > reports.ndjson || true
          # Log ids only: report bodies can contain personal data and workflow
          # logs are public in a public repository.
          jq -r '.[] | "pending report: \(.id) [\(.severity)] \(.kind)"' reports.json || true

      - name: Open an issue per report
        if: steps.guard.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUPABASE_URL: https://vjrnabnawhegjdsvbyrc.supabase.co
          SECRET: ${{ secrets.SUPABASE_SECRET_KEY }}
          LEGACY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$SECRET" ]; then
            APIKEY="$SECRET"
            AUTH="$SECRET"
          else
            APIKEY="$LEGACY"
            AUTH="$LEGACY"
          fi
          if [ ! -s reports.ndjson ]; then
            echo "nothing to mirror"
            exit 0
          fi

          while IFS= read -r row; do
            [ -z "$row" ] && continue

            id=$(jq -r '.id' <<<"$row")
            kind=$(jq -r '.kind' <<<"$row")
            severity=$(jq -r '.severity' <<<"$row")
            title=$(jq -r '.title' <<<"$row")
            details=$(jq -r '.details' <<<"$row")
            steps=$(jq -r '.steps' <<<"$row")
            page_url=$(jq -r '.page_url' <<<"$row")
            ua=$(jq -r '.user_agent' <<<"$row")
            viewport=$(jq -r '.viewport' <<<"$row")
            theme=$(jq -r '.theme' <<<"$row")
            build=$(jq -r '.build' <<<"$row")
            reporter=$(jq -r '.reporter_name' <<<"$row")
            contact=$(jq -r '.contact' <<<"$row")
            created=$(jq -r '.created_at' <<<"$row")

            # Labels must exist or `gh issue create` fails; create them quietly first.
            case "$severity" in
              critical) sev_label="severity: critical" ;;
              high)     sev_label="severity: high" ;;
              low)      sev_label="severity: low" ;;
              *)        sev_label="severity: normal" ;;
            esac
            gh label create "$sev_label" --force --color "B60205" >/dev/null 2>&1 || true
            gh label create "source: in-app" --force --color "1D76DB" >/dev/null 2>&1 || true
            gh label create "type: $kind" --force --color "5319E7" >/dev/null 2>&1 || true

            body=$(cat <<EOF
          **Reported from the live site** · $created

          | | |
          |---|---|
          | **Kind** | $kind |
          | **Severity** | $severity |
          | **Reporter** | ${reporter:-anonymous} |
          | **Contact** | ${contact:-(not given)} |
          | **Build** | ${build:-unknown} |
          | **Theme** | ${theme:-unknown} |
          | **Viewport** | ${viewport:-unknown} |
          | **Page** | ${page_url:-unknown} |

          ### What happened

          $details

          ### Steps to reproduce

          ${steps:-(not given)}

          <details><summary>User agent</summary>

          \`\`\`
          ${ua:-unknown}
          \`\`\`

          </details>

          ---
          _Mirrored automatically from \`bug_reports.id = $id\`. Close this issue once resolved._
          EOF
          )

            url=$(gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "[$severity] $title" \
              --body "$body" \
              --label "source: in-app" \
              --label "type: $kind" \
              --label "$sev_label" \
              | tail -n1)

            number=$(basename "$url")
            echo "opened #$number for report $id"

            # Mark mirrored so the next run can't reopen a duplicate.
            curl -sS --fail -X PATCH \
              -H "apikey: $APIKEY" \
              -H "Authorization: Bearer $AUTH" \
              -H "Content-Type: application/json" \
              -H "Prefer: return=minimal" \
              "$SUPABASE_URL/rest/v1/bug_reports?id=eq.$id" \
              -d "{\"issue_number\": $number, \"status\": \"triaged\"}" \
              >/dev/null
          done < reports.ndjson
